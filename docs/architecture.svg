<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 610" width="1240" height="610" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">PokerLens architecture</title>
<desc id="d">The phone browser streams microphone audio and camera frames over one WebSocket to a FastAPI relay. The relay forwards them to Gemini Live, runs every tool call the model makes through a validating game-state engine, and streams the coach voice, table state and odds back to the phone. Manual fixes from the screen go straight to the game state and always win.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1B1A17"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#C0321F"/></marker></defs>
<rect width="1240" height="610" fill="#F4F0E8"/>
<rect x="40" y="74" width="360" height="436" rx="10" fill="none" stroke="#1B1A17" stroke-opacity=".28" stroke-dasharray="5 5"/>
<text x="56" y="62" font-size="12" font-weight="700" letter-spacing="1.6" fill="#1B1A17">PHONE</text>
<text x="384" y="62" font-size="12" fill="#5C584F" text-anchor="end">browser · React</text>
<rect x="520" y="74" width="380" height="436" rx="10" fill="none" stroke="#1B1A17" stroke-opacity=".28" stroke-dasharray="5 5"/>
<text x="536" y="62" font-size="12" font-weight="700" letter-spacing="1.6" fill="#1B1A17">RELAY</text>
<text x="884" y="62" font-size="12" fill="#5C584F" text-anchor="end">FastAPI · /ws/live</text>
<rect x="980" y="74" width="220" height="310" rx="10" fill="none" stroke="#1B1A17" stroke-opacity=".28" stroke-dasharray="5 5"/>
<text x="996" y="62" font-size="12" font-weight="700" letter-spacing="1.6" fill="#1B1A17">MODEL</text>
<text x="1184" y="62" font-size="12" fill="#5C584F" text-anchor="end">Gemini Live</text>
<rect x="60" y="112" width="320" height="80" rx="7" fill="#FBF9F4" stroke="#1B1A17" stroke-width="1.4"/>
<text x="220.0" y="145.5" font-size="15" font-weight="700" fill="#1B1A17" text-anchor="middle">Microphone</text>
<text x="220.0" y="164.5" font-size="12.5" fill="#5C584F" text-anchor="middle">16 kHz PCM, 100 ms chunks</text>
<rect x="60" y="210" width="320" height="80" rx="7" fill="#FBF9F4" stroke="#1B1A17" stroke-width="1.4"/>
<text x="220.0" y="235.0" font-size="15" font-weight="700" fill="#1B1A17" text-anchor="middle">Camera</text>
<text x="220.0" y="254.0" font-size="12.5" fill="#5C584F" text-anchor="middle">JPEG, at most 1 frame a second</text>
<text x="220.0" y="271.0" font-size="12.5" fill="#5C584F" text-anchor="middle">+ scene-change detector (32×24 thumbnail)</text>
<rect x="60" y="308" width="320" height="80" rx="7" fill="#FBF9F4" stroke="#1B1A17" stroke-width="1.4"/>
<text x="220.0" y="341.5" font-size="15" font-weight="700" fill="#1B1A17" text-anchor="middle">Earbud or speaker</text>
<text x="220.0" y="360.5" font-size="12.5" fill="#5C584F" text-anchor="middle">24 kHz PCM, gapless, interruptible</text>
<rect x="60" y="406" width="320" height="80" rx="7" fill="#FBF9F4" stroke="#1B1A17" stroke-width="1.4"/>
<text x="220.0" y="439.5" font-size="15" font-weight="700" fill="#1B1A17" text-anchor="middle">Screen (optional)</text>
<text x="220.0" y="458.5" font-size="12.5" fill="#5C584F" text-anchor="middle">the move · tap-to-fix · call log</text>
<rect x="540" y="112" width="340" height="248" rx="7" fill="#FBF9F4" stroke="#1B1A17" stroke-width="1.4"/>
<text x="710.0" y="212.5" font-size="15" font-weight="700" fill="#1B1A17" text-anchor="middle">LiveRelay</text>
<text x="710.0" y="231.5" font-size="12.5" fill="#5C584F" text-anchor="middle">ordered queues, video dropped first</text>
<text x="710.0" y="248.5" font-size="12.5" fill="#5C584F" text-anchor="middle">speech gate: silent unless asked</text>
<text x="710.0" y="265.5" font-size="12.5" fill="#5C584F" text-anchor="middle">session resume + reconnect</text>
<rect x="540" y="406" width="170" height="80" rx="7" fill="#E9F0EA" stroke="#1F6B4A" stroke-width="2"/>
<text x="625.0" y="431.0" font-size="15" font-weight="700" fill="#1B1A17" text-anchor="middle">GameState</text>
<text x="625.0" y="450.0" font-size="12.5" fill="#5C584F" text-anchor="middle">validates every report</text>
<text x="625.0" y="467.0" font-size="12.5" fill="#5C584F" text-anchor="middle">owns cards, pot, bets</text>
<rect x="740" y="406" width="140" height="80" rx="7" fill="#FBF9F4" stroke="#1B1A17" stroke-width="1.4"/>
<text x="810.0" y="431.0" font-size="15" font-weight="700" fill="#1B1A17" text-anchor="middle">Odds engine</text>
<text x="810.0" y="450.0" font-size="12.5" fill="#5C584F" text-anchor="middle">Monte Carlo equity</text>
<text x="810.0" y="467.0" font-size="12.5" fill="#5C584F" text-anchor="middle">pot odds · outs</text>
<rect x="1000" y="112" width="180" height="248" rx="7" fill="#FBF9F4" stroke="#1B1A17" stroke-width="1.4"/>
<text x="1090.0" y="212.5" font-size="15" font-weight="700" fill="#1B1A17" text-anchor="middle">Gemini Live</text>
<text x="1090.0" y="231.5" font-size="12.5" fill="#5C584F" text-anchor="middle">speech in, speech out</text>
<text x="1090.0" y="248.5" font-size="12.5" fill="#5C584F" text-anchor="middle">sees frames</text>
<text x="1090.0" y="265.5" font-size="12.5" fill="#5C584F" text-anchor="middle">calls tools</text>
<line x1="380" y1="152" x2="540" y2="152" stroke="#1B1A17" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460.0" y="145" font-size="12" fill="#1B1A17" text-anchor="middle">mic audio</text>
<line x1="380" y1="250" x2="540" y2="250" stroke="#1B1A17" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460.0" y="243" font-size="12" fill="#1B1A17" text-anchor="middle">frames + “scene settled”</text>
<line x1="540" y1="340" x2="380" y2="340" stroke="#1B1A17" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460.0" y="333" font-size="12" fill="#1B1A17" text-anchor="middle">coach voice</text>
<line x1="540" y1="430" x2="380" y2="430" stroke="#1B1A17" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460.0" y="423" font-size="12" fill="#1B1A17" text-anchor="middle">state · odds · transcript</text>
<line x1="380" y1="466" x2="540" y2="466" stroke="#C0321F" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="460.0" y="484" font-size="12" fill="#C0321F" text-anchor="middle">manual fix — always wins</text>
<line x1="880" y1="156" x2="1000" y2="156" stroke="#1B1A17" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="940.0" y="149" font-size="12" fill="#1B1A17" text-anchor="middle">audio + frames</text>
<line x1="1000" y1="216" x2="880" y2="216" stroke="#1B1A17" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="940.0" y="209" font-size="12" fill="#1B1A17" text-anchor="middle">voice</text>
<line x1="1000" y1="270" x2="880" y2="270" stroke="#1B1A17" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="940.0" y="263" font-size="12" fill="#1B1A17" text-anchor="middle">tool calls</text>
<line x1="880" y1="324" x2="1000" y2="324" stroke="#1B1A17" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="940.0" y="317" font-size="12" fill="#1B1A17" text-anchor="middle">tool results</text>
<line x1="590" y1="360" x2="590" y2="406" stroke="#1B1A17" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="598" y="388" font-size="12" fill="#1B1A17" text-anchor="start">tool calls</text>
<line x1="680" y1="406" x2="680" y2="360" stroke="#1B1A17" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="688" y="388" font-size="12" fill="#1B1A17" text-anchor="start">accepted / rejected + facts</text>
<line x1="710" y1="446" x2="740" y2="446" stroke="#1B1A17" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="100" font-size="11.5" fill="#5C584F" text-anchor="middle" font-style="italic">one WebSocket</text>
<text x="940" y="100" font-size="11.5" fill="#5C584F" text-anchor="middle" font-style="italic">Live API</text>
<line x1="40" y1="548" x2="1200" y2="548" stroke="#1B1A17" stroke-width="1"/>
<text x="40" y="578" font-size="15" fill="#1B1A17"><tspan font-weight="700">The rule that keeps it honest:</tspan> the model only reports what it saw and heard. Code decides what is true and does the maths.</text>
<text x="1010" y="420" font-size="12" fill="#5C584F"><tspan x="1000" dy="0">The model never holds the pot,</tspan><tspan x="1000" dy="17">the cards or the odds. It asks</tspan><tspan x="1000" dy="17">the engine every time.</tspan></text>
</svg>